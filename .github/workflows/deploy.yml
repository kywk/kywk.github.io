name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # content:check 只在「會讓 build 失敗」的問題上回傳非 0（tab 縮排、控制字元等），
      # 品質類提醒是 warning 不擋。想連 warning 一起擋就加 -- --strict
      - name: Content check
        run: npm run content:check
      - name: Build website
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build