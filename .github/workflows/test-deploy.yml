name: Test deployment

on:
  pull_request:
    branches:
      - main

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 與 package.json 的 volta / engines 對齊。20.19 是底線：
          # plugins/remark-obsidian-kanban 以 require() 載入 ESM-only 的
          # unist-util-visit@5，需要 Node >= 20.19 的 require(esm)。
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Content check
        run: npm run content:check
      - name: Test build website
        run: npm run build